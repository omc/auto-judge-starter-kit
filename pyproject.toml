[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bonsai-auto-judge"
version = "0.4.0"
description = "Bonsai LLM judge for TREC Auto-Judge"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Max Irwin, Bonsai"}
]
keywords = ["trec", "autojudge", "rag", "evaluation", "ir"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "autojudge-base>=0.4.0",
    "openai>=1.0",
    "tira>=0.0.100",
    "spacy>=3.7,<4",  # concept-F1 (bonsai_judge); model installed via `spacy download` in Dockerfile
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
minima-llm = [
    "minima-llm>=0.2.5",
]
pyterrier = [
    "python-terrier>=0.10",
]
evaluate = [
    "autojudge-evaluate>=0.4.0",
]
all = [
    "bonsai-auto-judge[minima-llm,pyterrier,evaluate,test]",
    "tqdm>=4.0",
]

[project.urls]
Homepage = "https://github.com/omc/bonsai-auto-judge"
Repository = "https://github.com/omc/bonsai-auto-judge"

[tool.setuptools.packages.find]
where = ["."]
include = ["judges*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
