# BonsaiJudge Workflow Configuration

nugget_class: "judges.bonsai_judge.bonsai_judge:BonsaiNuggetCreator"
qrels_class: "judges.bonsai_judge.bonsai_judge:BonsaiQrelsCreator"
judge_class: "judges.bonsai_judge.bonsai_judge:BonsaiLeaderboardJudge"

# Lifecycle flags
create_nuggets: true
create_qrels: true
judge: true

# Data flow
nugget_depends_on_responses: true
judge_uses_nuggets: true
judge_uses_qrels: true
qrels_uses_nuggets: true

force_recreate_nuggets: false
force_recreate_qrels: false
augment_report: false

# Default settings
settings:
  filebase: "bonsai_judge"

nugget_settings:
  questions_per_topic: 3

qrels_settings:
  grade_range: [0, 3]

judge_settings:
  on_missing_evals: "fix_aggregate"
  # deterministic concept-F1 measures (no extra LLM calls)
  spacy_model: "en_core_web_lg"   # en_core_web_trf for the transformer (~25x slower)
  include_propn: true
  nproc: 1
  batch_size: 128
